name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
      
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Rebuild Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/rental-management/backend
            git fetch origin main
            git reset --hard origin/main
            cd backend
            docker build -t rental-backend:0.0.1 .
            docker stop rental-management-api || true
            docker rm rental-management-api || true

            docker run -d   --name rental-management-api   -p 8000:8000   --restart always   --add-host=host.docker.internal:host-gateway   --env-file ~/rental-management/backend/.env   rental-backend:0.0.1  
